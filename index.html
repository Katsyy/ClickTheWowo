<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Click The Wowo</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: url('image.jpg') no-repeat center center fixed;
      background-size: cover;
      overflow: hidden;
      user-select: none;
    }

    .header {
      position: absolute;
      top: 30px;
      width: 100%;
      text-align: center;
      color: white;
      text-shadow: 0 2px 5px rgba(0,0,0,0.5);
      pointer-events: none;
    }

    .header h1 {
      margin: 0;
      font-size: 3rem;
      font-weight: bold;
    }

    .scoreboard {
      font-size: 2rem;
      font-weight: bold;
      margin-top: 10px;
    }

    .cps {
      font-size: 1.2rem;
      margin-top: 5px;
    }

    .notification {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 10px 15px;
      border-radius: 8px;
      font-size: 1rem;
      display: none;
      align-items: center;
      gap: 10px;
      z-index: 999;
    }

    .notification img {
      width: 30px;
      height: 30px;
    }

    .popcat {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      cursor: pointer;
      touch-action: manipulation;
    }

    #popcat-image {
      width: 300px;
      height: auto;
      transition: transform 0.1s ease-in-out;
      pointer-events: auto;
      user-select: none;
      -webkit-user-drag: none;
      -webkit-touch-callout: none;
    }

    #popcat-image.clicked {
      transform: scale(0.9);
    }

    footer {
      position: absolute;
      bottom: 10px;
      width: 100%;
      text-align: center;
      color: rgba(255, 255, 255, 0.6);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div class="notification" id="achievement-notif">
    <img src="" id="notif-img" alt="achievement" />
    <span id="notif-text"></span>
  </div>

  <div class="header">
    <h1>Click The Wowo</h1>
    <div class="scoreboard"><span id="click-count">0</span></div>
    <div class="cps">Klik per detik: <span id="cps">0</span></div>
  </div>

  <div class="popcat" tabindex="0" id="popcat">
    <img src="wowo trn.png" alt="Wowo" id="popcat-image" />
  </div>

  <footer>&copy; Made by Katss</footer>

  <script>
    (function () {
      const popcatDiv = document.getElementById('popcat');
      const popcatImage = document.getElementById('popcat-image');
      const clickCountDisplay = document.getElementById('click-count');
      const cpsDisplay = document.getElementById('cps');
      const notifBox = document.getElementById('achievement-notif');
      const notifText = document.getElementById('notif-text');
      const notifImg = document.getElementById('notif-img');

      const meowAudio = new Audio('hidup-jokowi.mp3');
      meowAudio.preload = 'auto';

      let clickCount = Number(localStorage.getItem('clickCount')) || 0;
      let soundEnabled = localStorage.getItem('soundEnabled') !== 'false';
      let clicksInSecond = 0;
      let achievements = new Set();

      const achievementData = [
        { count: 100, text: "Hebat! 100 klik!", img: "a1.png" },
        { count: 500, text: "Luar biasa! 500 klik!", img: "a2.png" },
        { count: 1000, text: "Seribu klik! Anda Gila!", img: "a3.png" },
        { count: 2000, text: "2000 klik! Mesin kah?", img: "a4.png" },
        { count: 10000, text: "10K klik! WOW", img: "a5.png" },
        { count: 15000, text: "15K klik! Sangat berdedikasi!", img: "a6.png" },
        { count: 55000, text: "55K klik! Legenda hidup!", img: "a7.png" },
        { count: 1705070, text: "Juara Sejati!", img: "a8.png" },
      ];

      clickCountDisplay.textContent = clickCount;

      function playSound() {
        if (!soundEnabled) return;
        meowAudio.pause();
        meowAudio.currentTime = 0;
        meowAudio.play().catch(() => {});
      }

      function animatePopcat() {
        popcatImage.classList.add('clicked');
        setTimeout(() => {
          popcatImage.classList.remove('clicked');
        }, 150);
      }

      function showAchievement(text, img) {
        notifText.textContent = text;
        notifImg.src = img;
        notifBox.style.display = 'flex';
        setTimeout(() => {
          notifBox.style.display = 'none';
        }, 3000);
      }

      function checkAchievement() {
        for (const a of achievementData) {
          if (clickCount >= a.count && !achievements.has(a.count)) {
            achievements.add(a.count);
            showAchievement(a.text, a.img);
          }
        }
      }

      function incrementClick() {
        clickCount++;
        clicksInSecond++;
        clickCountDisplay.textContent = clickCount;
        localStorage.setItem('clickCount', clickCount.toString());
        checkAchievement();
      }

      function handleClick() {
        incrementClick();
        playSound();
        animatePopcat();
      }

      popcatDiv.addEventListener('click', handleClick);
      popcatDiv.addEventListener('touchstart', (e) => {
        e.preventDefault();
        handleClick();
      });

      window.addEventListener('keydown', () => {
        handleClick();
      });

      // Update CPS
      setInterval(() => {
        cpsDisplay.textContent = clicksInSecond;
        clicksInSecond = 0;
      }, 1000);
    })();
  </script>
</body>
</html>
