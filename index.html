<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Click The Wowo</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: url('1000153299.jpg') no-repeat center center fixed;
      background-size: cover;
      overflow: hidden;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }

    .header {
      position: absolute;
      top: 30px;
      width: 100%;
      text-align: center;
      color: white;
      text-shadow: 0 2px 5px rgba(0,0,0,0.5);
      pointer-events: none;
    }

    .header h1 {
      margin: 0;
      font-size: 3rem;
      font-weight: bold;
    }

    .scoreboard {
      font-size: 2rem;
      font-weight: bold;
      margin-top: 10px;
    }

    .popcat {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      cursor: pointer;
      outline: none;
      touch-action: manipulation;
    }

    #popcat-image {
      width: 300px;
      height: auto;
      transition: transform 0.1s ease-in-out;
      pointer-events: auto;
      user-select: none;
      -webkit-user-drag: none;
      -webkit-touch-callout: none;
    }

    #popcat-image.clicked {
      transform: scale(0.9);
    }

    footer {
      position: absolute;
      bottom: 10px;
      width: 100%;
      text-align: center;
      color: rgba(255, 255, 255, 0.6);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Click The Wowo</h1>
    <div class="scoreboard"><span id="click-count">0</span></div>
  </div>

  <div class="popcat" tabindex="0" id="popcat">
    <img src="wowo trn.png" alt="Wowo" id="popcat-image" />
  </div>

  <footer>&copy; Made by Katss</footer>

  <script>
    (function () {
      const popcatDiv = document.getElementById('popcat');
      const popcatImage = document.getElementById('popcat-image');
      const clickCountDisplay = document.getElementById('click-count');
      const meowAudio = new Audio('hidup-jokowi.mp3');
      meowAudio.preload = 'auto';

      // Ambil nilai dari localStorage
      let clickCount = Number(localStorage.getItem('clickCount')) || 0;
      clickCountDisplay.textContent = clickCount;

      function playSound() {
        meowAudio.pause();
        meowAudio.currentTime = 0;
        meowAudio.play().catch(() => {});
      }

      function animatePopcat() {
        popcatImage.classList.add('clicked');
        setTimeout(() => {
          popcatImage.classList.remove('clicked');
        }, 150);
      }

      function incrementClick() {
        clickCount++;
        clickCountDisplay.textContent = clickCount;
        localStorage.setItem('clickCount', clickCount.toString()); // Simpan sebagai string
      }

      function handleClick() {
        incrementClick();
        playSound();
        animatePopcat();
      }

      // Klik mouse/tap
      popcatDiv.addEventListener('click', handleClick);
      popcatDiv.addEventListener('touchstart', (e) => {
        e.preventDefault();
        handleClick();
      });

      // Keyboard (semua tombol akan menambah klik)
      window.addEventListener('keydown', (e) => {
        handleClick();
      });
    })();
  </script>
</body>
</html>
