<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Click The Wowo!</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: url('image.jpg') no-repeat center center fixed;
      background-size: cover;
      overflow: hidden;
      user-select: none;
    }

    .header {
      position: absolute;
      top: 30px;
      width: 100%;
      text-align: center;
      color: white;
      text-shadow: 0 2px 5px rgba(0,0,0,0.5);
      pointer-events: none;
      z-index: 5;
    }

    .header h1 {
      margin: 0;
      font-size: 3rem;
      font-weight: bold;
    }

    .scoreboard {
      font-size: 2rem;
      font-weight: bold;
      margin-top: 10px;
    }

    .cps-box {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.5);
      color: white;
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 1.2rem;
      z-index: 5;
    }

    .popcat {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      cursor: pointer;
      touch-action: manipulation;
    }

    #popcat-image {
      width: 300px;
      height: auto;
      transition: transform 0.1s ease-in-out;
      pointer-events: auto;
      user-select: none;
      -webkit-user-drag: none;
      -webkit-touch-callout: none;
    }

    #popcat-image.clicked {
      transform: scale(0.9);
    }

    footer {
      position: absolute;
      bottom: 5px;
      width: 100%;
      text-align: center;
      color: rgba(255, 255, 255, 0.6);
      font-size: 0.9rem;
    }

    .settings-btn {
      position: absolute;
      bottom: 20px;
      left: 20px;
      width: 50px;
      height: 50px;
      background: rgba(255, 255, 255, 0.7);
      border: none;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    .settings-panel {
      position: absolute;
      bottom: 80px;
      left: 20px;
      background: rgba(0, 0, 0, 0.8);
      padding: 10px;
      border-radius: 10px;
      display: none;
      flex-direction: column;
      gap: 10px;
      z-index: 10;
    }

    .settings-panel button {
      background: white;
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 1rem;
      cursor: pointer;
    }

    .notification {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 10px 20px;
      border-radius: 12px;
      font-size: 1rem;
      display: none;
      align-items: center;
      gap: 10px;
      z-index: 20;
    }

    .notification img {
      height: 30px;
      width: 30px;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Click The Wowo!</h1>
    <div class="scoreboard"><span id="click-count">0</span></div>
  </div>

  <div class="cps-box">CPS: <span id="cps">0</span></div>

  <div class="popcat" tabindex="0" id="popcat">
    <img src="wowo trn.png" alt="Wowo" id="popcat-image" />
  </div>

  <button class="settings-btn" id="settings-toggle">⚙️</button>
  <div class="settings-panel" id="settings-panel">
    <button id="toggle-sound">🔊 Suara: Aktif</button>
    <button id="reset-clicks">🔄 Reset Klik</button>
  </div>

  <div class="notification" id="notification">
    <img src="" id="notif-img" />
    <span id="notif-msg"></span>
  </div>

  <footer>&copy; Made by Katss</footer>

  <script>
    (function () {
      const popcatDiv = document.getElementById('popcat');
      const popcatImage = document.getElementById('popcat-image');
      const clickCountDisplay = document.getElementById('click-count');
      const resetButton = document.getElementById('reset-clicks');
      const toggleSoundButton = document.getElementById('toggle-sound');
      const settingsToggle = document.getElementById('settings-toggle');
      const settingsPanel = document.getElementById('settings-panel');
      const cpsDisplay = document.getElementById('cps');
      const notifBox = document.getElementById('notification');
      const notifImg = document.getElementById('notif-img');
      const notifMsg = document.getElementById('notif-msg');

      const meowAudio = new Audio('hidup-jokowi.mp3');
      meowAudio.preload = 'auto';

      let clickCount = Number(localStorage.getItem('clickCount')) || 0;
      let soundEnabled = localStorage.getItem('soundEnabled') !== 'false';
      let clickTimestamps = [];

      clickCountDisplay.textContent = clickCount;
      toggleSoundButton.textContent = soundEnabled ? '🔊 Suara: Aktif' : '🔇 Suara: Mati';

      const achievements = [
        { count: 100, msg: "Kroco wak", img: "apabila.jpg", sound: "bawadehewak.mp3" },
        { count: 500, msg: "Sigma", img: "sigma.jpg", sound: "omaga.mp3" },
        { count: 1000, msg: "Hidup Jokowi 🔥", img: "aku-capres.jpg", sound: "pipa.mp3" },
        { count: 2000, msg: "nguawor cik", img: "nguawor.jpg", sound: "dungwob.mp3" },
        { count: 2045, msg: "2045 Indonesia (c)emas!", img: "indonesia-emas.jpg", sound: "snore.mp3" },
        { count: 10000, msg: "Wiwokdetok", img: "wiwokdetok.jpg", sound: "wiwokdetok.mp3" },
        { count: 15000, msg: "Fikss autoclicker", img: "rusdi.jpg", sound: "aduhgantengnya.mp3" },
        { count: 55000, msg: "Ngecit jirrr", img: "hengker.jpg", sound: "jancukpristel.mp3" },
        { count: 100000, msg: "unemployee (pengangguran)", img: "hitam.jpg", sound: "nguhaha.mp3" },
        { count: 1000000, msg: "touch some grass", img: "touchsomegrass.jpg", sound: "jawajawa.mp3" },
        { count: 1234567, msg: "hell nahh", img: "ino.jpg", sound: "cihuy.mp3" },
        { count: 2000000, msg: "unemployee final boss", img: "omkegas.jpg", sound: "omkegas.mp3" }
      ];
      let achieved = {};

      function playSound() {
        if (!soundEnabled) return;
        meowAudio.pause();
        meowAudio.currentTime = 0;
        meowAudio.play().catch(() => {});
      }

      function playAchievementSound(src) {
        if (!soundEnabled) return;
        meowAudio.pause();
        const audio = new Audio(src);
        audio.play().catch(() => {});
        audio.addEventListener('ended', () => {
          meowAudio.currentTime = 0;
          meowAudio.play().catch(() => {});
        });
      }

      function animatePopcat() {
        popcatImage.classList.add('clicked');
        setTimeout(() => {
          popcatImage.classList.remove('clicked');
        }, 150);
      }

      function incrementClick() {
        clickCount++;
        clickCountDisplay.textContent = clickCount;
        localStorage.setItem('clickCount', clickCount.toString());
        checkAchievements(clickCount);
        recordClickTime();
      }

      function handleClick() {
        incrementClick();
        playSound();
        animatePopcat();
      }

      function toggleSettings() {
        settingsPanel.style.display = settingsPanel.style.display === 'flex' ? 'none' : 'flex';
      }

      function checkAchievements(count) {
        for (let ach of achievements) {
          if (count === ach.count && !achieved[ach.count]) {
            achieved[ach.count] = true;
            showNotification(ach.msg, ach.img, ach.sound, count);
          }
        }
      }

      function showNotification(message, imgSrc, soundSrc, count) {
        notifMsg.textContent = `🎉 Achievement didapatkan: ${count} klik – ${message}`;
        notifImg.src = imgSrc;
        notifBox.style.display = 'flex';
        if (soundSrc) playAchievementSound(soundSrc);
        setTimeout(() => {
          notifBox.style.display = 'none';
        }, 5000);
      }

      function recordClickTime() {
        const now = Date.now();
        clickTimestamps.push(now);
        clickTimestamps = clickTimestamps.filter(ts => now - ts <= 1000);
        cpsDisplay.textContent = clickTimestamps.length;
      }

      popcatDiv.addEventListener('click', handleClick);
      popcatDiv.addEventListener('touchstart', (e) => {
        e.preventDefault();
        handleClick();
      });

      // === Anti Spam Keyboard: Semua tombol tapi tahan tidak spam ===
      const isPC = !/Mobi|Android/i.test(navigator.userAgent);
      let pressedKeys = {};

      if (isPC) {
        window.addEventListener('keydown', (e) => {
          if (!pressedKeys[e.code]) {
            pressedKeys[e.code] = true;
            handleClick();
          }
        });

        window.addEventListener('keyup', (e) => {
          pressedKeys[e.code] = false;
        });
      }

      resetButton.addEventListener('click', () => {
        clickCount = 0;
        clickCountDisplay.textContent = '0';
        localStorage.setItem('clickCount', '0');
        achieved = {};
      });

      toggleSoundButton.addEventListener('click', () => {
        soundEnabled = !soundEnabled;
        localStorage.setItem('soundEnabled', soundEnabled.toString());
        toggleSoundButton.textContent = soundEnabled ? '🔊 Suara: Aktif' : '🔇 Suara: Mati';
      });

      settingsToggle.addEventListener('click', toggleSettings);

      setInterval(() => {
        const now = Date.now();
        clickTimestamps = clickTimestamps.filter(ts => now - ts <= 1000);
        cpsDisplay.textContent = clickTimestamps.length;
      }, 500);

      // Easter Egg
      const secretCode = ['a', 'd', 'm', 'i', 'n', '6'];
      let inputSequence = [];

      if (isPC) {
        window.addEventListener('keydown', (e) => {
          inputSequence.push(e.key);
          if (inputSequence.length > secretCode.length) {
            inputSequence.shift();
          }
          if (JSON.stringify(inputSequence) === JSON.stringify(secretCode)) {
            const jumlah = prompt("kok anda tau kode rahasia?");
            const parsed = parseInt(jumlah);
            if (!isNaN(parsed) && parsed >= 0) {
              clickCount = parsed;
              clickCountDisplay.textContent = parsed;
              localStorage.setItem('clickCount', parsed.toString());
              alert("Jumlah klik diatur ke " + parsed);
            }
            inputSequence = [];
          }
        });
      }

    })();
  </script>
</body>
</html>
