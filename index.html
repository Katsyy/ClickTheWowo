<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Click The Wowo</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: url('image.jpg') no-repeat center center fixed;
      background-size: cover;
      overflow: hidden;
      user-select: none;
    }

    .header {
      position: absolute;
      top: 30px;
      width: 100%;
      text-align: center;
      color: white;
      text-shadow: 0 2px 5px rgba(0,0,0,0.5);
      pointer-events: none;
    }

    .header h1 {
      margin: 0;
      font-size: 3rem;
      font-weight: bold;
    }

    .scoreboard {
      font-size: 2rem;
      font-weight: bold;
      margin-top: 10px;
    }

    .settings-button {
      position: absolute;
      bottom: 20px;
      left: 20px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.8);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      font-size: 1.5rem;
    }

    .settings-panel {
      position: absolute;
      bottom: 80px;
      left: 20px;
      background: rgba(255, 255, 255, 0.9);
      padding: 10px;
      border-radius: 10px;
      display: none;
      flex-direction: column;
      gap: 10px;
      z-index: 10;
    }

    .settings-panel button {
      padding: 8px 14px;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: rgba(0, 0, 0, 0.1);
      transition: background 0.3s;
    }

    .settings-panel button:hover {
      background: rgba(0, 0, 0, 0.2);
    }

    .popcat {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      cursor: pointer;
      touch-action: manipulation;
    }

    #popcat-image {
      width: 300px;
      height: auto;
      transition: transform 0.1s ease-in-out;
      pointer-events: auto;
      user-select: none;
      -webkit-user-drag: none;
      -webkit-touch-callout: none;
    }

    #popcat-image.clicked {
      transform: scale(0.9);
    }

    footer {
      position: absolute;
      bottom: 10px;
      width: 100%;
      text-align: center;
      color: rgba(255, 255, 255, 0.6);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Click The Wowo</h1>
    <div class="scoreboard"><span id="click-count">0</span></div>
  </div>

  <div class="popcat" tabindex="0" id="popcat">
    <img src="wowo trn.png" alt="Wowo" id="popcat-image" />
  </div>

  <!-- Tombol Pengaturan dan Panel -->
  <button class="settings-button" id="settings-button">⚙️</button>
  <div class="settings-panel" id="settings-panel">
    <button id="toggle-sound">🔊 Suara: Aktif</button>
    <button id="reset-clicks">🔄 Reset Klik</button>
  </div>

  <footer>&copy; Made by Katss</footer>

  <script>
    (function () {
      const popcatDiv = document.getElementById('popcat');
      const popcatImage = document.getElementById('popcat-image');
      const clickCountDisplay = document.getElementById('click-count');
      const resetButton = document.getElementById('reset-clicks');
      const toggleSoundButton = document.getElementById('toggle-sound');
      const settingsButton = document.getElementById('settings-button');
      const settingsPanel = document.getElementById('settings-panel');

      const meowAudio = new Audio('hidup-jokowi.mp3');
      meowAudio.preload = 'auto';

      let clickCount = Number(localStorage.getItem('clickCount')) || 0;
      let soundEnabled = localStorage.getItem('soundEnabled') !== 'false';

      clickCountDisplay.textContent = clickCount;
      toggleSoundButton.textContent = soundEnabled ? '🔊 Suara: Aktif' : '🔇 Suara: Mati';

      function playSound() {
        if (!soundEnabled) return;
        meowAudio.pause();
        meowAudio.currentTime = 0;
        meowAudio.play().catch(() => {});
      }

      function animatePopcat() {
        popcatImage.classList.add('clicked');
        setTimeout(() => {
          popcatImage.classList.remove('clicked');
        }, 150);
      }

      function incrementClick() {
        clickCount++;
        clickCountDisplay.textContent = clickCount;
        localStorage.setItem('clickCount', clickCount.toString());
      }

      function handleClick() {
        incrementClick();
        playSound();
        animatePopcat();
      }

      popcatDiv.addEventListener('click', handleClick);
      popcatDiv.addEventListener('touchstart', (e) => {
        e.preventDefault();
        handleClick();
      });

      window.addEventListener('keydown', () => {
        handleClick();
      });

      resetButton.addEventListener('click', () => {
        clickCount = 0;
        localStorage.setItem('clickCount', '0');
        clickCountDisplay.textContent = '0';
      });

      toggleSoundButton.addEventListener('click', () => {
        soundEnabled = !soundEnabled;
        localStorage.setItem('soundEnabled', soundEnabled.toString());
        toggleSoundButton.textContent = soundEnabled ? '🔊 Suara: Aktif' : '🔇 Suara: Mati';
      });

      settingsButton.addEventListener('click', () => {
        settingsPanel.style.display = settingsPanel.style.display === 'flex' ? 'none' : 'flex';
      });
    })();
  </script>
</body>
</html>
